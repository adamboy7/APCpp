name: CI

# Trigger this workflow on push or pull request
on: [push, pull_request]

jobs:
  build-win:
    name: Build (windows-latest, ${{ matrix.kind }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - kind: static
            shared: OFF
          - kind: shared
            shared: ON
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: 'recursive'

    - name: CMake configure (default version)
      run: |
        mkdir build
        cd build
        cmake -G "Visual Studio 17 2022" -A Win32 `
              -DCMAKE_BUILD_TYPE=Release `
              -DAPCPP_BUILD_SHARED=${{ matrix.shared }} ..
    - name: Build (default version)
      run: |
        cd build
        cmake --build . --config Release

    - name: Create Artifact Folder
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force artifact | Out-Null
        New-Item -ItemType Directory -Force artifact/mbedtls | Out-Null

        # APCpp output
        Copy-Item build/Release/APCpp.lib artifact -Force
        if ("${{ matrix.shared }}" -eq "ON") {
          $dll = Get-ChildItem -Path build -Recurse -File -Filter "APCpp.dll" |
            Where-Object { $_.FullName -match "\\Release\\" } |
            Select-Object -First 1
          if (-not $dll) { throw "APCpp.dll not found under build/ (shared build requested)." }
          Copy-Item $dll.FullName artifact -Force
        }

        # mbedTLS outputs (built on Windows because USE_TLS is ON)
        $mbeds = Get-ChildItem -Path build -Recurse -File -Include "mbedtls*.lib","mbedx509*.lib","mbedcrypto*.lib" |
          Where-Object { $_.FullName -match "\\Release\\" } |
          Select-Object -Unique
        foreach ($f in $mbeds) { Copy-Item $f.FullName artifact/mbedtls -Force }

    - name: Create Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: APCpp-win-${{ matrix.kind }}
        path: |
          artifact/**

  build-msys:
    name: Build (MSYS)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: git mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-cmake unzip make
      - name: CMake configure (MSYS)
        run: |
          mkdir build
          cd build
          cmake .. -DWIN32=1 -DMSYS=1 -G"MSYS Makefiles"
      - name: Build (MSYS)
        run: |
          cd build
          cmake --build .

  build-linux:
    name: Build (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config

      - name: CMake configure (Release, static + mbedtls)
        run: |
          mkdir -p build
          cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release -DAPCPP_BUILD_SHARED=OFF -DUSE_MBED_TLS=ON

      - name: Build
        run: |
          cd build
          cmake --build . --config Release

      - name: Create Artifact Folder
        run: |
          mkdir -p artifact/mbedtls
          # APCpp (static)
          if [ -f build/libAPCpp.a ]; then
            cp build/libAPCpp.a artifact/
          else
            # CMake generators can vary; fall back to search
            find build -maxdepth 3 -type f -name "libAPCpp.a" -print -exec cp {} artifact/ \;
          fi

          # mbedTLS static libs (we force USE_MBED_TLS=ON above)
          find build -type f \( -name "libmbedtls*.a" -o -name "libmbedx509*.a" -o -name "libmbedcrypto*.a" \) -print -exec cp {} artifact/mbedtls/ \;

      - name: Create Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: APCpp-linux-static
          path: |
            artifact/**

  bundle-satisfactory-archipelago-mod:
    name: Bundle (SatisfactoryArchipelagoMod)
    runs-on: ubuntu-latest
    needs: [build-win, build-linux]
    steps:
      - name: Download Windows static artifact
        uses: actions/download-artifact@v4
        with:
          name: APCpp-win-static
          path: in/win

      - name: Download Linux static artifact
        uses: actions/download-artifact@v4
        with:
          name: APCpp-linux-static
          path: in/linux

      - name: Assemble bundle folder structure
        run: |
          set -euo pipefail
          OUT="SatisfactoryArchipelagoMod/Source/APCpp/lib"
          mkdir -p "$OUT/Win64/mbedtls" "$OUT/Linux/mbedtls"

          # Windows
          cp -f in/win/APCpp.lib "$OUT/Win64/"
          if [ -d in/win/mbedtls ]; then
            cp -f in/win/mbedtls/* "$OUT/Win64/mbedtls/" || true
          fi

          # Linux
          # Keep the default static library name from CMake: libAPCpp.a
          if [ -f in/linux/libAPCpp.a ]; then
            cp -f in/linux/libAPCpp.a "$OUT/Linux/"
          else
            # fall back if pathing differs
            find in/linux -maxdepth 2 -type f -name "libAPCpp.a" -print -exec cp -f {} "$OUT/Linux/" \;
          fi
          if [ -d in/linux/mbedtls ]; then
            cp -f in/linux/mbedtls/* "$OUT/Linux/mbedtls/" || true
          fi

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: SatisfactoryArchipelagoMod-bundle
          path: |
            SatisfactoryArchipelagoMod/**

  build-mac:
    name: Build (macOS)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'
      - name: CMake configure
        run: |
          mkdir build
          cd build
          cmake ..
      - name: Build
        run: |
          cd build
          cmake --build .
