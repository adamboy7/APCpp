  build-linux:
    name: Build (Linux, ${{ matrix.kind }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - kind: static
            shared: OFF
          - kind: shared
            shared: ON
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config

      - name: CMake configure (Release)
        run: |
          mkdir -p build
          cd build
          cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DAPCPP_BUILD_SHARED=${{ matrix.shared }} \
            -DUSE_MBED_TLS=ON

      - name: Build
        run: |
          cd build
          cmake --build . --config Release

      - name: Create Artifact Folder
        run: |
          set -euo pipefail
          mkdir -p artifact/mbedtls

          if [ "${{ matrix.shared }}" = "OFF" ]; then
            # --- APCpp (static) ---
            if [ -f build/libAPCpp.a ]; then
              cp build/libAPCpp.a artifact/
            else
              find build -maxdepth 5 -type f -name "libAPCpp.a" -print -exec cp {} artifact/ \;
            fi

            # --- mbedTLS static libs ---
            find build -type f \( -name "libmbedtls*.a" -o -name "libmbedx509*.a" -o -name "libmbedcrypto*.a" \) \
              -print -exec cp {} artifact/mbedtls/ \;

            # --- Extra dependency libs (static) ---
            find build -type f \( -name "libixwebsocket*.a" -o -name "libjsoncpp*.a" -o -name "libz*.a" -o -name "libzlib*.a" \) \
              -print -exec cp {} artifact/ \;

          else
            # --- APCpp (shared) ---
            # Capture libAPCpp.so plus any symlinked version files if present.
            find build -maxdepth 5 -type f -name "libAPCpp.so*" -print -exec cp -P {} artifact/ \;

            # Optional: include any shared deps if they are produced by the build (often they won't be).
            find build -maxdepth 5 -type f \( \
              -name "libixwebsocket.so*" -o \
              -name "libjsoncpp.so*" -o \
              -name "libmbedtls.so*" -o \
              -name "libmbedx509.so*" -o \
              -name "libmbedcrypto.so*" -o \
              -name "libz.so*" -o \
              -name "libzlib.so*" \
            \) -print -exec cp -P {} artifact/ \; || true

            # No mbedtls folder needed for shared (leave it empty / absent)
            rm -rf artifact/mbedtls || true
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: APCpp-linux-${{ matrix.kind }}
          path: artifact/**
